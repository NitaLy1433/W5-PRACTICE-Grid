<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Grid Layout Example</title>

<style>
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    display: flex;
    justify-content: center;
    padding: 40px;
    background: #fafafa;
  }

  .container {
    width: 900px;                 
    background: #222;             
    padding: 12px;
    border-radius: 6px;
    box-sizing: border-box;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);  
    grid-auto-rows: minmax(80px, auto);    
    gap: 20px;                             
  }

  .item {
    background: #4f90d6;
    color: white;
    padding: 16px;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 18px;
  }

  .a { grid-column: 1 / -1; }
  .b { grid-column: 1 / 2; grid-row: 2 / 4; }
  .c { grid-column: 2 / 3; grid-row: 2; }
  .d { grid-column: 3 / 4; grid-row: 2; }
  .e { grid-column: 2 / 4; grid-row: 3; }
  .f { grid-column: 1 / -1; grid-row: 4; }
</style>

</head>
<body>

  <div class="container">
    <div class="grid">
      <div class="item a">a</div>
      <div class="item b">b</div>
      <div class="item c">c</div>
      <div class="item d">d</div>
      <div class="item e">e</div>
      <div class="item f">f</div>
    </div>
  </div>

</body>
</html>
